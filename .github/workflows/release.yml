name: Release image

# Kargo auto-promotes the pushed release-production tag to every Kahouse
# deployment (data-mesh and kahouse-data-events in factorial-infrastructure), so a
# dispatch is a production deploy. Pull requests only build. ACR only: no
# deployment pulls Kahouse from ECR.

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/release.yml"
  workflow_dispatch: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Build and push image
        uses: factorialco/actions/docker-build-push@v2.17.0
        with:
          repository-name: factorial/kahouse
          do-push-to-aws: false
          do-login: ${{ github.event_name != 'pull_request' }}
          destination-action: ${{ github.event_name == 'pull_request' && 'docker' || 'push' }}
