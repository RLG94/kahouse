name: Release image

# Pushes factorial.azurecr.io/factorial/kahouse:release-production-<ts>-<sha>. Kargo
# auto-promotes that tag to every Kahouse deployment (data-mesh and
# kahouse-data-events in factorial-infrastructure), so a dispatch is a production
# deploy. Pull requests only build.
#
# Azure login uses the org-wide factorial-github-releaser OIDC federation, so no
# token or per-repo setup is needed. All Kahouse deployments pull from ACR only.

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/release.yml"
  workflow_dispatch: {}

env:
  ACR_NAME: factorial
  IMAGE: factorial.azurecr.io/factorial/kahouse

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Azure login (OIDC)
        if: github.event_name != 'pull_request'
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: f3503fac-8479-4341-8620-dcb4112e0fc0
          tenant-id: f5794977-444e-45ef-affe-248fff94dbd7
          subscription-id: 95d5f146-c2df-490d-9e1f-5d96402a88a0

      - name: Log in to ACR
        if: github.event_name != 'pull_request'
        run: az acr login --name "$ACR_NAME"

      - name: Compute image tag
        id: tag
        run: echo "tag=release-production-$(date -u +'%Y%m%dT%H%M%S')-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
